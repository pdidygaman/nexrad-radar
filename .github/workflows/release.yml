name: Build & Release

# Runs automatically when you push a version tag like: git tag v1.2.0 && git push origin v1.2.0
# Also has a manual trigger button on the Actions tab for testing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.1) — only used for workflow_dispatch'
        required: false
        default: '0.0.0'

# Needed so the release step can create the GitHub Release + upload the installer.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Source ───────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller scipy

      # ── 3. Version ──────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          echo "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # stamp version.py so the built exe knows its own version
          "__version__ = '$v'" | Out-File -FilePath version.py -Encoding utf8NoBOM
          Write-Output "Building version $v"

      # ── 4. PyInstaller ──────────────────────────────────────────────
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: Verify exe was produced
        shell: pwsh
        run: |
          $exe = "dist\NEXRAD Radar\NEXRAD Radar.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller did not produce the exe" }
          Write-Output "exe OK: $((Get-Item $exe).Length) bytes"

      # ── 5. Inno Setup ───────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Output "Downloading latest Inno Setup 6..."
          curl.exe -L --retry 3 -o "$env:RUNNER_TEMP\innosetup.exe" https://jrsoftware.org/download.php/is.exe
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          Write-Output "Inno Setup installed."

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          Write-Output "ISCC: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }

      # ── 6. Rename installer with version ────────────────────────────
      - name: Rename installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $src = "installer\NEXRAD-Radar-Setup.exe"
          $dst = "installer\NEXRAD-Radar-v${v}-Setup.exe"
          Copy-Item $src $dst
          echo "INSTALLER=installer\NEXRAD-Radar-v${v}-Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── 7. Create GitHub Release ─────────────────────────────────────
      - name: Create release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "NEXRAD Radar v${{ steps.ver.outputs.version }}"
          body: |
            ## NEXRAD Radar v${{ steps.ver.outputs.version }}

            ### Install / Update
            Download **NEXRAD-Radar-v${{ steps.ver.outputs.version }}-Setup.exe** below and run it.
            The app will notify you automatically when the next update is available.

            ### Notes
            <!-- Add change notes here when you create the release on GitHub, or edit this after the workflow runs -->
          files: ${{ env.INSTALLER }}
          draft: false
          prerelease: false

  # ════════════════════════════════════════════════════════════════════
  # macOS build — ONE .dmg that runs on EVERY Mac.
  # GitHub's Intel (macos-13) runners are being retired and now queue for
  # hours, so instead of a per-arch matrix we build an *x86_64* app on the
  # plentiful Apple-Silicon runner (macos-14) under Rosetta 2. An x86_64 app
  # runs natively on Intel Macs and via Rosetta on Apple Silicon — so a single
  # binary covers both, with no dependency on the scarce Intel runners.
  # Runs after the Windows job so the release already exists.
  # ════════════════════════════════════════════════════════════════════
  build-macos:
    needs: build
    runs-on: macos-14          # Apple Silicon — always available
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ensure Rosetta 2 (to run the x86_64 toolchain)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Install universal2 Python 3.11 (from python.org)
        run: |
          # The python.org "macos11" installer is universal2 (x86_64 + arm64),
          # so we can drive its x86_64 slice via `arch -x86_64` to build Intel.
          curl -fL -o /tmp/python.pkg \
            https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          PY="/Library/Frameworks/Python.framework/Versions/3.11/bin/python3"
          echo "PY=$PY" >> "$GITHUB_ENV"
          arch -x86_64 "$PY" -c "import platform; print('toolchain arch =', platform.machine())"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          printf "__version__ = '%s'\n" "$V" > version.py
          echo "Building macOS version $V"

      - name: Generate icon.icns
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out "icon.iconset/icon_${s}x${s}.png"
            d=$((s*2))
            sips -z $d $d icon.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns icon.iconset -o icon.icns
          ls -la icon.icns

      - name: Install dependencies (x86_64 via Rosetta)
        run: |
          arch -x86_64 "$PY" -m pip install --upgrade pip
          arch -x86_64 "$PY" -m pip install -r requirements.txt
          arch -x86_64 "$PY" -m pip install pyinstaller

      - name: Build x86_64 .app (Rosetta)
        run: arch -x86_64 "$PY" -m PyInstaller --noconfirm --clean build_mac.spec

      - name: Verify x86_64 and package .dmg
        run: |
          APP="dist/NEXRAD Radar.app"
          if [ ! -d "$APP" ]; then echo "ERROR: .app not produced"; ls -la dist; exit 1; fi
          BIN="$APP/Contents/MacOS/NEXRAD Radar"
          echo "Binary arch:"; file "$BIN"
          # Sanity check: the bootloader MUST be x86_64 or it won't run on Intel.
          if ! file "$BIN" | grep -q x86_64; then
            echo "ERROR: bootloader is not x86_64 — Rosetta build failed"; exit 1
          fi
          # ad-hoc sign so Gatekeeper doesn't report it as "damaged"
          codesign --force --deep --sign - "$APP" || true
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          DMG="NEXRAD-Radar-v${VERSION}-mac.dmg"
          hdiutil create -volname "NEXRAD Radar" -srcfolder dmgroot -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          ls -la "$DMG"

      - name: Upload .dmg to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.DMG }}
